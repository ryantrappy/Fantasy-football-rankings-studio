services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE}
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/fantasy_rankings
      PORT: 3001
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3001:3001"
    networks:
      - fantasy-internal

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - fantasy-internal

volumes:
  mongo-data:

networks:
  fantasy-internal:
    name: fantasy-internal
