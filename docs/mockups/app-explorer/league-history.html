<script>
(() => {
  const root = document.getElementById('history-designs');
  const names = ['Alex Morgan','Blair Davis','Casey Brooks','Devon Lee','Jordan Ellis','Taylor Reed'];
  const years = [2025,2024,2023];
  const topics = [
    ['League overview','overview','chart-no-axes-combined','League'],['Manager comparison','comparison','users','League'],['Season history','seasons','calendar-days','League'],
    ['Head-to-head','h2h','swords','Competition'],['Schedule & luck','schedule','calendar-range','Competition'],['Elo ratings','elo','trending-up','Competition'],['Playoffs & clutch','playoffs','trophy','Competition'],
    ['Hall of Fame & Shame','honors','medal','Record book'],['Competitive eras','eras','flag','Record book'],['Matchup records','records','notebook-tabs','Record book'],['Weekly Pain Index','pain','heart-crack','Record book'],
    ['Matchup stories','stories','sparkles','Beyond the scores'],['Manager profiles','profiles','contact-round','Beyond the scores']
  ];
  const icon = name => '<i data-lucide="'+name+'" aria-hidden="true"></i>';
  const short = i => names[i].split(' ')[0];
  const initials = i => names[i].split(' ').map(n=>n[0]).join('');
  const games = [];
  years.forEach((year,yi) => {
    let rotation=[0,1,2,3,4,5];
    for(let w=1;w<=14;w++) {
      for(let n=0;n<3;n++) {
        const a=rotation[n],b=rotation[5-n];
        const score=i=>Math.round((107+24*Math.sin((i+2)*13+w*1.7+yi*4)+10*Math.cos(w*.8+i)+i*1.3)*100)/100;
        games.push({year,week:w,a,b,sa:score(a),sb:score(b)});
      }
      rotation=[rotation[0],rotation[5],...rotation.slice(1,5)];
    }
  });
  const states = [
    {el:document.getElementById('topic-workspace'),mode:'topic',manager:0,topic:'h2h',years:[...years],matrix:false,minimum:3,query:'',descending:true,selection:1},
    {el:document.getElementById('manager-explorer'),mode:'explorer',manager:0,topic:'h2h',years:[...years],matrix:false,minimum:3,query:'',descending:true,selection:1}
  ];
  const num = n => Number(n).toLocaleString('en-US',{maximumFractionDigits:1});
  function pair(s,a,b) {
    const gs=games.filter(g=>s.years.includes(g.year)&&((g.a===a&&g.b===b)||(g.a===b&&g.b===a)));
    let w=0,l=0,t=0,pf=0,pa=0;
    gs.forEach(g=>{const x=g.a===a?g.sa:g.sb,y=g.a===a?g.sb:g.sa;pf+=x;pa+=y;if(x>y)w++;else if(x<y)l++;else t++;});
    return {id:b,w,l,t,n:gs.length,pf,pa,rate:gs.length?(w+t*.5)/gs.length:0,margin:gs.length?(pf-pa)/gs.length:0,gs};
  }
  function standings(s) {
    return names.map((name,id)=>{
      const rs=names.map((_,i)=>i).filter(i=>i!==id).map(i=>pair(s,id,i));
      const w=rs.reduce((a,r)=>a+r.w,0),l=rs.reduce((a,r)=>a+r.l,0),n=w+l;
      return {name,id,w,l,n,rate:n?w/n:0,pf:rs.reduce((a,r)=>a+r.pf,0)};
    }).sort((a,b)=>b.rate-a.rate);
  }

  function table(headers,rows,s,selectable=false) {
    return '<div class="fr-tablewrap"><table><thead><tr>'+headers.map((h,i)=>'<th scope="col">'+(h==='Win %'?'<button data-sort class="cursor-interaction" aria-label="Sort by win percentage">Win % '+(s.descending?'↓':'↑')+'</button>':h)+'</th>').join('')+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr '+(selectable&&r.id===s.selection?'class="fr-selected"':'')+'>'+r.cells.map((c,j)=>'<td>'+(j===0&&selectable?'<button class="fr-rowlink cursor-interaction" data-row="'+r.id+'">'+c+'</button>':c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';

  function evidence(s,compact=false) {
    const r=pair(s,s.manager,s.selection);

  function rivalry(s) {
    const rs=names.map((_,i)=>i).filter(i=>i!==s.manager).map(i=>pair(s,s.manager,i));
    const eligible=rs.filter(r=>r.n>=s.minimum),sorted=[...eligible].sort((a,b)=>Math.abs(a.rate-.5)-Math.abs(b.rate-.5)||b.n-a.n);
    const best=[...eligible].filter(r=>r.rate>.5).sort((a,b)=>b.rate-a.rate)[0],worst=[...eligible].filter(r=>r.rate<.5).sort((a,b)=>a.rate-b.rate)[0];
    let html='<div class="fr-sectionhead"><div><h2>Head-to-head</h2><p>'+names[s.manager]+' against the league · wins, losses, and the games behind them.</p></div></div><div class="fr-viewtabs"><button data-matrix="false" aria-pressed="'+!s.matrix+'" class="cursor-interaction">Opponent records</button><button data-matrix="true" aria-pressed="'+s.matrix+'" class="cursor-interaction">League matrix</button></div>';
    if(s.matrix) {
      html+='<p class="fr-muted fr-small">Row manager’s record against each opponent. Select a record to inspect the rivalry.</p>';
      html+=table(['Manager',...names.map((_,i)=>short(i))],names.map((n,a)=>({cells:[short(a),...names.map((_,b)=>{const r=pair(s,a,b);return a===b?'—':'<button data-pair="'+a+','+b+'" class="fr-rowlink cursor-interaction" aria-label="'+n+' versus '+names[b]+', '+r.w+' wins and '+r.l+' losses">'+r.w+'–'+r.l+'</button>';})]})),s);
    } else {
      html+='<div class="fr-highlights">'+[['Closest rival',sorted[0]],['Punching bag',best],['Kryptonite',worst]].map(([label,r])=>'<div class="fr-highlight"><span>'+label+'</span><strong>'+(r?short(r.id):'Not enough evidence')+'</strong><small>'+(r?r.w+'–'+r.l+'–'+r.t+' · '+r.n+' games':'Try a lower minimum')+'</small></div>').join('')+'</div><div class="fr-toolbar"><label class="fr-search">'+icon('search')+'<input type="search" data-search aria-label="Search opponents" placeholder="Find an opponent" value="'+s.query.replaceAll('"','&quot;')+'"></label><label class="fr-small fr-muted">Rivalry minimum <select data-minimum aria-label="Minimum rivalry games" style="min-width:78px;padding:5px"><option value="3" '+(s.minimum===3?'selected':'')+'>3 games</option><option value="5" '+(s.minimum===5?'selected':'')+'>5 games</option><option value="10" '+(s.minimum===10?'selected':'')+'>10 games</option></select></label></div>';
      const filtered=rs.filter(r=>names[r.id].toLowerCase().includes(s.query.toLowerCase())).sort((a,b)=>s.descending?b.rate-a.rate:a.rate-b.rate);
      html+=table(['Opponent','W–L–T','Games','Win %','Avg. margin'],filtered.map(r=>({id:r.id,cells:[names[r.id],r.w+'–'+r.l+'–'+r.t,r.n,num(r.rate*100)+'%','<span class="'+(r.margin>=0?'fr-positive':'fr-negative')+'">'+(r.margin>0?'+':'')+num(r.margin)+'</span>']})),s,true).replace('<table>','<table class="fr-opponent-table">');
      if(!filtered.length)html+='<div class="fr-notice">No opponents match your search.</div>';
      html+='<div class="fr-footnote"><span>'+filtered.length+' opponents · select a name for game evidence</span><span>W–L–T = wins, losses, ties</span></div>';
    }
    return html+'<details class="fr-explain"><summary class="cursor-interaction">'+icon('info')+' Rivalry definitions & coverage</summary><p>Closest rival is nearest to a 50% win rate. Punching bag requires a winning record; kryptonite requires a losing record. Labels require '+s.minimum+' meetings. Every opponent remains visible regardless of the label threshold.</p><p>Renamed teams follow their manager identity. Incomplete or unpaired scores are excluded. View all contributing scores by selecting an opponent.</p></details>';
  }
  function panel(s) {
    if(!s.years.length)return '<div class="fr-notice">Choose at least one season to explore the archive.</div>';
    if(s.topic==='h2h')return rivalry(s);
    const title=topics.find(t=>t[1]===s.topic)[0],rows=standings(s),m=rows.find(r=>r.id===s.manager);
    let body='',description='',method='Values use only available records in the selected seasons. Unknown outcomes stay unavailable. Select Head-to-head to explore individual game evidence.';

      description=s.topic==='overview'?'The league at a glance. Open a topic when you want the details.':'Compare managers using the same seasons and scoring context.';
      body=table(['Manager','Record','Win %','Points scored'],rows.map(r=>({cells:[r.name,r.w+'–'+r.l,num(r.rate*100)+'%',num(r.pf)]})),s);
      body+='<div class="fr-library">'+[['Explore rivalries','h2h','Head-to-head records & league matrix'],['Follow rating history','elo','Results over time'],['Browse record book','records','Close games, blowouts & scoring'],['Revisit matchup stories','stories','Trades, comebacks & lineup regrets']].map(t=>'<button data-topic="'+t[1]+'" class="cursor-interaction"><span>'+t[0]+'<small>'+t[2]+'</small></span>'+icon('arrow-up-right')+'</button>').join('')+'</div>';
    } else if(s.topic==='seasons') {
      description=names[s.manager]+' across the selected seasons. Team names can change; manager identity stays connected.';
      body=table(['Season','Record','Win %','Points for'],s.years.map(year=>{const sub={...s,years:[year]},r=standings(sub).find(r=>r.id===s.manager);return {cells:[year,r.w+'–'+r.l,num(r.rate*100)+'%',num(r.pf)]};}),s);
    } else if(s.topic==='elo') {
      description='One league-wide ranking, with the game-by-game explanation one step away.';
      body=table(['Manager','Elo','Since start','Games'],rows.map((r,i)=>({cells:[r.name,1584-i*34,(i<3?'+':'')+(84-i*34),r.n]})),s);
      method='Ratings begin at 1500, use K=32, and carry across seasons. Results affect Elo; scoring margins do not. All values here are illustrative.';
    } else if(s.topic==='schedule') {
      description='Separate scoring strength from the opponents a manager happened to face.';
      body=table(['Manager','Actual wins','Expected wins','Difference'],rows.map((r,i)=>({cells:[r.name,r.w,num(r.w+(i%2?-2.1:1.8)),'<span class="'+(i%2?'fr-positive':'fr-negative')+'">'+(i%2?'+2.1':'−1.8')+'</span>']})),s)+'<details class="fr-explain"><summary class="cursor-interaction">'+icon('repeat-2')+' Replay another manager’s schedule</summary><p>Compare '+names[s.manager]+'’s weekly scoring with another manager’s opponents. The full implementation will expose a donor picker and every included game here.</p></details>';
      method='Expected wins compare each weekly score with all other finite team scores. Actual and expected totals use the same eligible sample. Schedule replays cannot establish final standings or tie-breakers.';

      method='Only explicit championship-path series count. Multiweek series count once. Missing bracket metadata cannot be inferred from final standings.';
    } else if(s.topic==='honors') {
      description='Achievements and rough stretches, with sample sizes beside each claim.';
      body='<div class="fr-localpicker"><button data-honor="fame" aria-pressed="true" class="cursor-interaction">Hall of Fame</button><button data-honor="shame" aria-pressed="false" class="cursor-interaction">Hall of Shame</button></div><div data-honortable>'+table(['Manager','Honor score','Seasons','Coverage'],rows.map((r,i)=>({cells:[r.name,78-i*8,s.years.length,'5 of 5 metrics']})),s)+'</div>';
      method='The honor score combines available championship, playoff finish, regular win rate, scoring, and longevity metrics. It is a descriptive league honor. Coverage matters more than small differences.';
    } else if(s.topic==='eras') {
      description='Recognize sustained success without bridging missing years.';
      body=table(['Manager','Window','Achievement','Evidence'],[{cells:[names[0],'2023–2025','2 championships','3 / 3 seasons']},{cells:[names[3],'2023–2025','71% regular wins','Complete window']}],s)+'<details class="fr-explain"><summary class="cursor-interaction">'+icon('sliders-horizontal')+' Era thresholds</summary><p>Default window: 3 seasons. Title threshold: 2. Sustained regular win rate: 70%. Adjustable thresholds would live here, beside this view.</p></details>';
      method='Full calendar windows require complete supporting evidence. Missing seasons never bridge an era. Examples here are illustrative.';
    } else if(s.topic==='records') {
      description='A single record book with categories, instead of several stacked tables.';
      body='<div class="fr-localpicker">'+['Closest games','Blowouts','Combined scoring','Individual scores','Worst beats'].map((n,i)=>'<button data-record="'+i+'" aria-pressed="'+(i===0)+'" class="cursor-interaction">'+n+'</button>').join('')+'</div><div data-recordtable>'+recordTable(s,0)+'</div>';
      method='Scores stay in their original scoring system. Worst beats are losses with a top-quarter weekly score and complete roster scoring coverage. Aggregate playoff series are labeled separately.';
    } else if(s.topic==='pain') {
      description='Painful losses ranked together only when their evidence is comparable.';
      body='<div class="fr-notice">Coverage cohort: scoring + margin. No archived pre-Monday forecast in this sample.</div>'+table(['Manager','Week','Score','Margin','Pain index'],[{cells:[names[1],'2025 · W8','141.2','−0.4','94.2']},{cells:[names[4],'2024 · W11','138.6','−1.1','91.7']},{cells:[names[0],'2023 · W6','129.4','−0.8','88.5']}],s);
      method='A playful descriptive index combines closeness, own scoring percentile, opponent percentile, and archived expectation when available. Missing components are excluded and remaining weights are renormalized.';
    } else if(s.topic==='stories') {

      body='<div class="fr-localpicker">'+['Activity','Player impact','Player loyalty','Draft overlap','Archetypes','Season Wrapped'].map((n,i)=>'<button data-profile="'+n+'" aria-pressed="'+(i===0)+'" class="cursor-interaction">'+n+'</button>').join('')+'</div><div data-profilecontent>'+table(['Season','Pickups','Drops','Trades','Coverage'],s.years.map((y,i)=>({cells:[y,28+i*6,24+i*5,2+i,'Complete']})),s)+'</div>';
      method='Activity labels require complete coverage. Managers follow provider identity across renames. Profiles are descriptive, with source coverage shown for each component.';
    }

  function recordTable(s,index) {
    const sample=games.filter(g=>s.years.includes(g.year));
    sample.sort((a,b)=>index===0?Math.abs(a.sa-a.sb)-Math.abs(b.sa-b.sb):index===1?Math.abs(b.sa-b.sb)-Math.abs(a.sa-a.sb):index===2?b.sa+b.sb-a.sa-a.sb:Math.max(b.sa,b.sb)-Math.max(a.sa,a.sb));
    return table(['Matchup','Season / week','Scores',index===2?'Combined':'Margin'],sample.slice(0,5).map(g=>({cells:[short(g.a)+' vs. '+short(g.b),g.year+' / W'+g.week,num(g.sa)+' – '+num(g.sb),num(index===2?g.sa+g.sb:Math.abs(g.sa-g.sb))]})),s);
  }

  function save(s){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{design:s.mode==='topic'?'Topic workspace':'Manager explorer',topic:topics.find(t=>t[1]===s.topic)[0]},privateContent:states.map(x=>({topic:x.topic,manager:x.manager,years:x.years}))}).catch(()=>{});}
  const saved=window.openai?.widgetState?.privateContent;
  if(Array.isArray(saved))states.forEach((s,i)=>{const x=saved[i];if(x&&topics.some(t=>t[1]===x.topic)&&Number.isInteger(x.manager)&&x.manager>=0&&x.manager<6&&Array.isArray(x.years)){s.topic=x.topic;s.manager=x.manager;s.years=x.years.filter(y=>years.includes(y));}});

      else if(b.hasAttribute('data-record')){s.el.querySelectorAll('[data-record]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));s.el.querySelector('[data-recordtable]').innerHTML=recordTable(s,Number(b.dataset.record));}
      else if(b.dataset.honor){s.el.querySelectorAll('[data-honor]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));s.el.querySelector('[data-honortable]').innerHTML=b.dataset.honor==='fame'?table(['Manager','Honor score','Seasons'],standings(s).map((r,i)=>({cells:[r.name,78-i*8,s.years.length]})),s):table(['Record','Manager','Evidence'],[{cells:['Lowest weekly score',names[4],'2024 · W9 · 65.2 pts']},{cells:['Longest losing streak',names[2],'2023 · W4–W9 · 6 losses']},{cells:['Largest season collapse',names[1],'2025 · 71% → 29% wins']}],s);}
      else if(b.dataset.story){s.el.querySelectorAll('[data-story]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));const label=b.dataset.story;s.el.querySelector('[data-storycontent]').innerHTML=label==='Monday miracles'||label==='Probability replay'?'<div class="fr-notice">'+label+' unavailable: no archived probability snapshots.</div>':table([label,'Manager','Season','Evidence'],[{cells:[label==='Lineup regrets'?'Bench outscored starters':label==='Draft skill'?'Value after the draft':label==='Dropped breakouts'?'Breakout after a drop':'Trade contribution',names[s.manager],'2025','Sample event · inspect in final design']},{cells:['Season comparison',names[s.manager],'2024','Source coverage: complete']}],s);}
      else if(b.dataset.profile){s.el.querySelectorAll('[data-profile]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));s.el.querySelector('[data-profilecontent]').innerHTML=b.dataset.profile==='Activity'?table(['Season','Pickups','Drops','Trades'],s.years.map((y,i)=>({cells:[y,28+i*6,24+i*5,2+i]})),s):'<div class="fr-notice">'+b.dataset.profile+' · '+names[s.manager]+'</div><p class="fr-muted">A focused '+b.dataset.profile.toLowerCase()+' view would show its own supporting records and coverage here.</p>';}
      refreshIcons();
    });
    s.el.addEventListener('change',e=>{
      const t=e.target;
      if(t.hasAttribute('data-year')){const y=Number(t.dataset.year);s.years=t.checked?[...s.years,y]:s.years.filter(x=>x!==y);render(s);save(s);}
      else if(t.hasAttribute('data-topic-picker')){s.topic=t.value;s.query='';s.matrix=false;render(s);save(s);}
      else if(t.hasAttribute('data-manager')){s.manager=Number(t.value);render(s);save(s);}
      else if(t.hasAttribute('data-minimum')){s.minimum=Number(t.value);updatePanel(s);}
    });
    s.el.addEventListener('input',e=>{if(e.target.hasAttribute('data-search')){s.query=e.target.value;const start=e.target.selectionStart;updatePanel(s);const input=s.el.querySelector('[data-search]');input.focus();input.setSelectionRange(start,start);}});
    const appearance={spacing:12};
    if(globalThis.Tweak){const tweak=new Tweak({container:s.el,onChange:()=>s.el.style.setProperty('--fr-pad',appearance.spacing+'px')});tweak.addSlider(appearance,'spacing',{label:'Table row padding',min:8,max:18,unit:'px'});}
  });
  function updatePanel(s){s.el.querySelector('[data-panel]').innerHTML=panel(s);refreshIcons();}
  function showEvidence(s){s.el.querySelectorAll('tbody tr').forEach(tr=>tr.classList.toggle('fr-selected',Number(tr.querySelector('[data-row]')?.dataset.row)===s.selection));const target=s.mode==='topic'?s.el.querySelector('[data-evidence]'):s.el.querySelector('[data-inspector]');target.hidden=false;target.innerHTML=evidence(s,s.mode==='explorer');target.setAttribute('aria-live','polite');refreshIcons();save(s);}
  window.addEventListener('openai:set_globals',e=>{const data=e.detail?.globals?.widgetState?.privateContent;if(!Array.isArray(data))return;states.forEach((s,i)=>{const x=data[i];if(x&&topics.some(t=>t[1]===x.topic)&&Number.isInteger(x.manager)&&x.manager>=0&&x.manager<6&&Array.isArray(x.years)){const nextYears=x.years.filter(y=>years.includes(y));if(s.topic===x.topic&&s.manager===x.manager&&JSON.stringify(s.years)===JSON.stringify(nextYears))return;s.topic=x.topic;s.manager=x.manager;s.years=nextYears;render(s);}});});
})();
</script>
