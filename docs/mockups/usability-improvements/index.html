<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Trapp • UI & Usability Improvements Mockup</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div class="review-bar">
      <strong>Trapp UI/Usability Redesign Prototype</strong>
      <span>Manager Explorer v2 · 100% Feature-Preserving</span>
      <div class="review-controls">
        <label>
          <input type="checkbox" id="ux-toggle" checked style="width:15px;height:15px" />
          Show UX improvement callouts
        </label>
        <label>
          Preview state
          <select id="state">
            <option>Ready</option>
            <option>Loading</option>
            <option>Empty</option>
            <option>Error</option>
          </select>
        </label>
      </div>
    </div>

    <header class="app-topbar">
      <div class="brand">
        <span class="mark">T</span>
        <div>
          <strong>Trapp</strong>
          <small>Fantasy Studio</small>
        </div>
      </div>

      <nav class="primary-nav" id="nav" aria-label="Main navigation"></nav>

      <details class="account-menu" id="account-menu">
        <summary id="account">Alex Morgan ▾</summary>
        <div class="account-menu-items">
          <button type="button" data-page="9">👤 Profile & connections</button>
          <button type="button" data-page="8">➕ Create / connect league</button>
          <button type="button" data-page="7">⚙ Manage leagues</button>
          <hr style="border:0;border-top:1px solid var(--line);margin:4px 0" />
          <button type="button" data-action="signoutPreview">Sign out</button>
        </div>
      </details>
    </header>

    <main id="main"></main>

    <div id="toast" role="status" aria-live="polite"></div>

    <dialog id="dialog">
      <div id="dialog-body"></div>
      <div style="margin-top:16px;text-align:right">
        <button type="button" id="close">Close</button>
      </div>
    </dialog>

    <script src="app.js"></script>
    <script>
      render();
    </script>
  </body>
</html>
